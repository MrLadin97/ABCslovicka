<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="description" content="Anglická slovíčka pro malé děti, které ještě neumí číst: kreslené kartičky s výslovností, hry, minihry a sbírka karet.">
<meta name="theme-color" content="#CFE8FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ABC slovíčka">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}
body{margin:0;font:14px system-ui, -apple-system, sans-serif;overscroll-behavior:none}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>ABC slovíčka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: one-screen playroom. Small top bar, then one big stage that swaps between home, flashcards, the listening game and the celebration. Sticker look: thick ink outlines + hard drop shadows. */
:root{
  --sky:#CFE8FF;
  --sky-deep:#B3D8FB;
  --ink:#1D2B53;
  --paper:#FFFDF7;
  --sun:#FFC93C;
  --tomato:#FF6B5B;
  --grass:#2FB36D;
  --berry:#7C5CE8;
  --muted:#5B6890;
  --display:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{
  background-color:var(--sky);
  background-image:radial-gradient(var(--sky-deep) 2.2px, transparent 2.8px);
  background-size:30px 30px;
  color:var(--ink);
  font-family:var(--body);
  overflow:hidden;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--berry);outline-offset:3px}

.app{
  height:100%; box-sizing:border-box;
  max-width:920px; margin:0 auto;
  display:flex; flex-direction:column; gap:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:12px 16px;
}

/* sticker button base */
.stk{
  background:var(--paper);
  border:3px solid var(--ink);
  border-radius:22px;
  box-shadow:0 5px 0 var(--ink);
  transition:transform .08s ease, box-shadow .08s ease;
}
.stk:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;min-height:56px}
.bar .spacer{flex:1}
.round{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;padding:0}
.round svg{width:28px;height:28px}
.stars{
  display:flex;align-items:center;gap:6px;height:50px;padding:0 16px 0 10px;border-radius:999px;
  font-family:var(--display);font-weight:700;font-size:1.5rem;background:var(--sun);
  font-variant-numeric:tabular-nums;cursor:default;
}
.stars .e{display:block;width:30px;height:30px}
.stars .e svg,.qprog svg,.bit svg{display:block;width:100%;height:100%}

.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}

/* ---------- HOME ---------- */
#home{justify-content:center;align-items:center;gap:22px;overflow-y:auto;padding-bottom:8px}
.logo{
  margin:0;font-family:var(--display);font-weight:700;text-align:center;
  font-size:clamp(2rem, 7vw, 3.4rem);line-height:1;letter-spacing:.01em;text-wrap:balance;
}
.logo span{display:inline-block}
.logo .l1{color:var(--tomato);transform:rotate(-4deg)}
.logo .l2{color:var(--grass);transform:rotate(3deg)}
.logo .l3{color:var(--berry);transform:rotate(-2deg)}
.logo .w{color:var(--ink)}
.sub{margin:-12px 0 0;font-weight:700;color:var(--muted);text-align:center}

.cats{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:760px}
.cat{
  --c:var(--berry);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  width:96px;padding:10px 4px 8px;border-radius:20px;
}
.cat .ico{display:block;width:58px;height:58px}
.cat .ico svg,.mode .ico svg,.flash .pic svg,.choice .pic svg,.badge svg,.ctl.slow svg,.trophy svg{display:block;width:100%;height:100%}
.cat .nm{font-family:var(--display);font-weight:600;font-size:.95rem}
.cat[aria-pressed="true"]{background:var(--c);color:#fff;transform:translateY(-3px) rotate(-2deg);box-shadow:0 8px 0 var(--ink)}
.cat[aria-pressed="true"]:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}

.modes{display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:12px;width:min(820px, 100%)}
@media (max-width:620px){ .modes{grid-template-columns:repeat(2, minmax(0, 1fr))} }
.mode{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:12px 8px 12px;border-radius:26px;
  font-family:var(--display);font-weight:700;font-size:clamp(1rem, 3vw, 1.25rem);
}
.mode .ico{display:block;width:clamp(64px, 16vw, 96px);aspect-ratio:1}
.mode.m1{background:var(--sun)}
.mode.m2{background:var(--grass);color:#fff}
.mode.m3{background:var(--berry);color:#fff}
.mode.m4{background:#7FD4F0}
.mode.m5{background:#FFB3C7}
.mode.m6{background:var(--tomato);color:#fff}
.mode.m7{background:#2FB3A8;color:#fff}
.mode .ico.album{border-radius:16px;overflow:hidden;border:3px solid var(--ink);box-sizing:border-box;transform:rotate(-5deg)}
.parent-btn{
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
  font-weight:800;font-size:.85rem;color:var(--muted);background:var(--paper);
}
.parent-btn svg{width:18px;height:18px}
.parent-btn::before{content:"";position:absolute;inset:0;background:var(--sun);transform:scaleX(var(--hold, 0));transform-origin:left;z-index:0}
.parent-btn > *{position:relative;z-index:1}

/* ---------- FLASHCARDS ---------- */
.stage{flex:1;min-height:0;display:grid;place-items:center;touch-action:pan-y;container-type:size}
.flash{
  --c:var(--berry);
  position:relative;
  width:min(100cqw, 75cqh, 450px);aspect-ratio:3/4;
  box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:14px 14px 18px;border-radius:34px;
  background:var(--paper);
  border:4px solid var(--ink);
  box-shadow:0 8px 0 var(--ink);
}
.flash:active{transform:translateY(3px);box-shadow:0 5px 0 var(--ink)}
.flash .frame{
  width:100%;flex:1;min-height:0;border-radius:24px;
  background:
    radial-gradient(circle at 50% 55%, rgba(255,255,255,.7) 0 44%, transparent 45%),
    color-mix(in srgb, var(--c) 55%, #fff);
  display:grid;place-items:center;overflow:hidden;
  border:3px solid var(--ink);
}
.flash .pic{display:block;width:88%;height:88%}
.flash .word{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem, 7.5vh, 3.6rem);line-height:1.1;margin-top:10px;text-align:center}
.flash .cz{font-weight:700;color:var(--muted);font-size:1rem;min-height:1.3em}
.badge{
  position:absolute;top:-14px;left:-12px;width:54px;height:54px;border-radius:50%;
  display:grid;place-items:center;padding:4px;box-sizing:border-box;
  background:var(--paper);border:3px solid var(--ink);transform:rotate(-10deg);
}
.flash.in-right{animation:inR .35s cubic-bezier(.2,.9,.3,1.3)}
.flash.in-left{animation:inL .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes inR{from{transform:translateX(60px) rotate(6deg);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-60px) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}

.controls{display:flex;justify-content:center;align-items:center;gap:clamp(10px, 3vw, 22px)}
.ctl{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;padding:0}
.ctl svg{width:34px;height:34px}
.ctl.say{width:96px;height:96px;background:var(--sun)}
.ctl.say svg{width:48px;height:48px}
.ctl.slow{background:#C9F2DA;padding:8px;box-sizing:border-box}
.count{text-align:center;font-family:var(--display);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-4px}

.talking{animation:talk .5s ease-in-out infinite alternate}
@keyframes talk{to{transform:scale(1.08)}}

/* ---------- LISTEN & FIND ---------- */
.qprog{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.qprog i{
  width:26px;height:26px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);
  display:grid;place-items:center;font-style:normal;line-height:1;box-sizing:border-box;padding:1px;
}
.qprog i.now{background:var(--sun);transform:scale(1.15)}
.qprog i.ok{background:var(--grass)}
.qprog i.star{background:var(--sun)}
.ear{align-self:center;width:118px;height:118px;border-radius:50%;display:grid;place-items:center;padding:0;background:var(--sun)}
.ear svg{width:60px;height:60px}
.choices{flex:1;min-height:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:14px;--cols:3;--max:300px}
.choice{
  --c:var(--berry);
  aspect-ratio:1;width:min(calc((100% - (var(--cols) - 1) * 14px) / var(--cols)), var(--max));padding:0;border-radius:28px;
  display:grid;place-items:center;
  background:radial-gradient(circle at 50% 55%, rgba(255,255,255,.7) 0 44%, transparent 45%), color-mix(in srgb, var(--c) 55%, #fff);
  border-width:4px;
}
.choice .pic{display:block;width:86%;height:86%}
.choice.right{background:var(--grass);animation:hop .5s ease}
.choice.wrong{animation:shake .4s ease;opacity:.35;filter:grayscale(1)}
.choice:disabled{cursor:default}
.choices.waiting .choice{pointer-events:none;opacity:.55;transition:opacity .2s}
.choices.waiting .choice.wrong{opacity:.3}
@keyframes hop{30%{transform:translateY(-16px) scale(1.08)}60%{transform:translateY(0) scale(.97)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

/* difficulty */
.diff-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.diff-lbl{font-weight:800;font-size:.85rem;color:var(--muted)}
.diff{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.dbtn{width:74px;height:58px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px}
.dbtn .mini{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;width:48px}
.dbtn .mini i{width:13px;height:13px;border-radius:4px;border:2px solid var(--ink);background:var(--sky)}
.dbtn b{font-family:var(--display);font-size:.9rem;line-height:1}
.dbtn[aria-pressed="true"]{background:var(--berry);color:#fff;transform:translateY(-3px);box-shadow:0 8px 0 var(--ink)}
.dbtn[aria-pressed="true"] .mini i{background:var(--sun)}

/* flag badge on sound buttons */
.ctl{position:relative}
.flagb{position:absolute;right:-8px;bottom:-6px;width:40px;height:40px;pointer-events:none}
.flagb svg,.ctl.cz svg.f{display:block;width:100%;height:100%}
.ctl.cz{background:var(--paper);padding:6px;box-sizing:border-box}
.ctl.cz svg{width:100%;height:100%}

/* ---------- REWARD RUNNER ---------- */
#game{gap:10px}
.gbar{display:flex;align-items:center;gap:12px}
.gtime{flex:1;height:22px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.gtime i{display:block;height:100%;width:100%;background:var(--grass);border-radius:999px;transition:width .2s linear}
.gscore{display:flex;align-items:center;gap:6px;height:46px;padding:0 14px 0 8px;border-radius:999px;background:var(--sun);font-family:var(--display);font-weight:700;font-size:1.4rem;font-variant-numeric:tabular-nums}
.gscore span{display:block;width:30px;height:30px}
.gscore svg{display:block;width:100%;height:100%}
.world{
  position:relative;flex:1;min-height:0;overflow:hidden;cursor:pointer;touch-action:none;
  border:4px solid var(--ink);border-radius:30px;box-shadow:0 8px 0 var(--ink);
  background:linear-gradient(#9FD8FF, #DDF2FF 75%);
}
.world .ground{
  position:absolute;left:0;right:0;bottom:0;height:20%;
  border-top:4px solid var(--ink);
  background-color:#7FD48A;
  background-image:repeating-linear-gradient(90deg, #6CC678 0 20px, #7FD48A 20px 40px);
}
.world .sunb{position:absolute;right:7%;top:9%;width:13%;aspect-ratio:1;border-radius:50%;background:#FFD23F;border:4px solid var(--ink)}
.cloud{position:absolute;width:120px;height:38px;border-radius:30px;background:#fff;border:3px solid var(--ink);animation:drift 26s linear infinite}
.cloud::before{content:"";position:absolute;width:56px;height:56px;border-radius:50%;background:#fff;border:3px solid var(--ink);border-bottom-color:transparent;border-right-color:transparent;transform:rotate(45deg);left:28px;top:-30px}
.cloud.c2{top:30%;animation-duration:38s;animation-delay:-18s;transform:scale(.7)}
.cloud.c1{top:12%}
@keyframes drift{from{left:105%}to{left:-30%}}
.runner,.ob,.gst{position:absolute;left:0;bottom:20%;will-change:transform}
.runner svg,.ob svg,.gst svg{display:block;width:100%;height:100%}
.runner .body{width:100%;height:100%;transform-origin:50% 100%;animation:run .32s ease-in-out infinite alternate}
.runner.air .body{animation:none;transform:rotate(-8deg)}
.runner.hurt{animation:blink .15s steps(2) infinite}
@keyframes run{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-6%) rotate(3deg)}}
@keyframes blink{50%{opacity:.25}}
.gst svg{animation:spin 1.6s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(18deg) scale(1.08)}}
.ghint{position:absolute;left:50%;top:40%;width:110px;height:110px;transform:translate(-50%,-50%);pointer-events:none;animation:hint 1s ease-in-out infinite alternate}
.ghint svg{width:100%;height:100%}
@keyframes hint{to{transform:translate(-50%,-62%)}}

/* generic game sprites */
.spr{position:absolute;left:0;top:0;will-change:transform}
.spr svg{display:block;width:100%;height:100%}
.spr.hurt{animation:blink .15s steps(2) infinite}
.spr.star svg{animation:spin 1.6s ease-in-out infinite alternate}
.world.w-car{background:#7FD48A;background-image:radial-gradient(#6CC678 3px, transparent 3.5px);background-size:26px 26px}
.road{position:absolute;top:-6px;bottom:-6px;background:#6B6585;border-left:5px solid var(--ink);border-right:5px solid var(--ink)}
.road .lane{position:absolute;top:0;bottom:0;width:6px;margin-left:-3px;background:repeating-linear-gradient(to bottom, #fff 0 34px, transparent 34px 68px)}
.road .edge{position:absolute;top:0;bottom:0;width:10px;background:repeating-linear-gradient(to bottom, #E8434A 0 20px, #fff 20px 40px)}
.world.w-moto{background:linear-gradient(#FFD9A8, #CDEBFF 70%)}
.world .hills{position:absolute;inset:0;width:100%;height:100%}
.world .mount{position:absolute;bottom:22%;width:46%;aspect-ratio:2/1;background:#B9A6E8;clip-path:polygon(0 100%, 45% 0, 100% 100%);opacity:.8}

/* ---------- PEXESO ---------- */
#pexeso{align-items:center;justify-content:center}
.pgrid{display:grid;gap:10px;justify-content:center;align-content:center;--size:100px;grid-template-columns:repeat(4, var(--size))}
.pcard{width:var(--size);height:var(--size);padding:0;border:none;background:none;perspective:700px}
.pcard .pin{position:relative;display:block;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,.8,.4,1.2);transform-style:preserve-3d}
.pcard.up .pin{transform:rotateY(180deg)}
.pback,.pface{position:absolute;inset:0;border-radius:20px;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);-webkit-backface-visibility:hidden;backface-visibility:hidden;display:grid;place-items:center;box-sizing:border-box}
.pback{background:var(--berry);background-image:radial-gradient(rgba(255,255,255,.25) 3px, transparent 3.5px);background-size:18px 18px}
.pback svg{width:42%;height:42%}
.pface{transform:rotateY(180deg);background:radial-gradient(circle at 50% 55%, rgba(255,255,255,.75) 0 44%, transparent 45%), color-mix(in srgb, var(--c) 55%, #fff)}
.pface svg{width:86%;height:86%}
.pcard.done .pface{background:var(--grass);animation:hop .5s ease}
.pcard.done{cursor:default}

/* ---------- DEJ OPIČCE ---------- */
.feed-top{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:10px}
.feed-monkey{width:min(34vh, 56vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle, #FFF6D6 0 60%, transparent 61%)}
.feed-monkey svg{display:block;width:100%;height:100%}
.feed-monkey.munch{animation:hop .6s ease}
.bubble{align-self:flex-start;margin-top:4vh;width:84px;height:72px;border-radius:30px 30px 30px 6px;display:grid;place-items:center;background:var(--sun);padding:0}
.bubble svg{width:40px;height:40px}
.bubble.happy{background:var(--grass);color:#fff}
.fitems{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;padding-bottom:6px}
.fitem{
  width:clamp(78px, 17vw, 140px);aspect-ratio:1;border-radius:24px;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);
  background:radial-gradient(circle at 50% 55%, rgba(255,255,255,.7) 0 44%, transparent 45%), color-mix(in srgb, var(--c) 55%, #fff);
  display:grid;place-items:center;cursor:grab;touch-action:none;position:relative;z-index:1;
}
.fitem svg{width:86%;height:86%;pointer-events:none}
.fitem.held{z-index:5;cursor:grabbing;box-shadow:0 12px 0 var(--ink)}
.fitem.fly{transition:transform .45s ease-in, opacity .45s ease-in;z-index:5}
.fitem.shake{animation:shake .4s ease}
.fitems.waiting .fitem,.bfield.waiting .bln{pointer-events:none;opacity:.55}

/* ---------- BALÓNKY ---------- */
.bal-top{display:flex;align-items:center;justify-content:center;gap:18px}
.bal-top .ear{width:96px;height:96px}
.bal-count{display:flex;gap:6px;min-width:60px;min-height:34px;align-items:center;padding:6px 12px;background:var(--paper);border:3px solid var(--ink);border-radius:999px}
.bal-count i{width:24px;height:24px;border-radius:50%;border:3px solid var(--ink);animation:hop .4s ease}
.bal-count:empty::before{content:"";width:24px;height:24px}
.bfield{flex:1;min-height:0;width:100%;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:6px;--size:110px}
.bln{width:var(--size);height:var(--size);padding:0;border:none;background:none;animation:bob 2.2s ease-in-out infinite alternate;animation-delay:calc(var(--d) * -1);transform:rotate(var(--r))}
.bln svg{display:block;width:100%;height:100%;pointer-events:none}
.bln.popped{animation:popb .25s ease-out forwards;pointer-events:none}
.bln.away{animation:away 1.1s ease-in forwards}
.bln.shake{animation:shake .4s ease}
@keyframes bob{from{transform:translateY(0) rotate(var(--r))}to{transform:translateY(-8%) rotate(calc(var(--r) * -1))}}
@keyframes popb{40%{transform:scale(1.25);opacity:1}to{transform:scale(1.6);opacity:0}}
@keyframes away{to{transform:translateY(-120vh);opacity:.6}}

/* ---------- SIMON SAYS ---------- */
.sim-stage{display:flex;align-items:center;justify-content:center;gap:16px}
#sim-choices:empty{display:none}
.sim-stage{flex:1;min-height:0}
#simon:has(#sim-choices:not(:empty)) .sim-stage{flex:0}
#simon:has(#sim-choices:not(:empty)) .simon-guy{width:min(20vh, 32vw)}
.simon-guy{width:min(44vh, 62vw);transition:width .3s ease;aspect-ratio:1;padding:0;border:none;background:radial-gradient(circle, #FFF6D6 0 60%, transparent 61%);border-radius:50%}
.simon-guy svg{display:block;width:100%;height:100%}
.sim-wait{width:min(14vh, 22vw);aspect-ratio:1}
.sim-wait svg{display:block;width:100%;height:100%}
.sim-wait.run{animation:hg 3s linear forwards}
@keyframes hg{0%{transform:rotate(0)}10%{transform:rotate(180deg)}90%{transform:rotate(180deg) scale(1)}100%{transform:rotate(180deg) scale(.6);opacity:0}}

/* ---------- COLLECTION ---------- */
#shop{overflow-y:auto;gap:18px;padding-bottom:12px}
.tier-h{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.2rem}
.tier-h .tstars{display:flex;gap:2px}
.tier-h .tstars svg{width:22px;height:22px}
.tier-h .tbar{flex:1;height:6px;border-radius:3px;background:var(--tc)}
.shop-row{display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:14px}
@media (max-width:620px){ .shop-row{grid-template-columns:repeat(2, minmax(0, 1fr))} }
.ccard{
  --tc:#7FD48A;
  position:relative;display:flex;flex-direction:column;gap:6px;padding:8px 8px 10px;border-radius:20px;
  background:var(--tc);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);cursor:pointer;text-align:center;
}
.ccard:active{transform:translateY(3px);box-shadow:0 3px 0 var(--ink)}
.ccard .cart{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--paper);border:3px solid var(--ink)}
.ccard .cart svg{display:block;width:100%;height:100%}
.ccard .cname{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.1;color:var(--ink);background:var(--paper);border-radius:10px;padding:3px 4px;border:2.5px solid var(--ink)}
.ccard.locked .cart svg{filter:blur(9px) saturate(.7) opacity(.55);transform:scale(1.15)}
.ccard.locked .cart::before{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:3.4rem;color:var(--ink);z-index:1;text-shadow:0 0 10px #fff}
.price{display:flex;align-items:center;justify-content:center;gap:4px;font-family:var(--display);font-weight:700;font-size:1.1rem;background:var(--sun);border:2.5px solid var(--ink);border-radius:999px;padding:1px 10px 1px 4px;align-self:center;font-variant-numeric:tabular-nums}
.price span{display:block;width:22px;height:22px}
.price svg{display:block;width:100%;height:100%}
.ccard.can .price{animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.ccard.t2 .cart::after,.ccard.t3 .cart::after{
  content:"";position:absolute;inset:-50%;pointer-events:none;
  background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,.55) 50%, transparent 60%);
  animation:sheen 3.2s ease-in-out infinite;
}
.ccard.t3 .cart::after{background:linear-gradient(115deg, transparent 36%, rgba(255,240,150,.5) 44%, rgba(255,255,255,.75) 50%, rgba(160,220,255,.45) 56%, transparent 64%);animation-duration:2.2s}
.ccard.locked .cart::after{display:none}
.ccard.t3{background:linear-gradient(135deg, #FFE27A, #FFB020 50%, #FFE9A8)}
@keyframes sheen{from{transform:translateX(-40%)}to{transform:translateX(40%)}}

.modal{position:fixed;inset:0;z-index:40;background:rgba(29,43,83,.55);display:grid;place-items:center;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.modal-in{display:flex;flex-direction:column;align-items:center;gap:16px;width:min(360px, 100%)}
.modal .ccard{width:100%;cursor:default;box-sizing:border-box}
.modal .ccard .cname{font-size:1.6rem}
.modal .ccard.reveal{animation:reveal .9s cubic-bezier(.2,.9,.3,1.2)}
@keyframes reveal{0%{transform:rotateY(90deg) scale(.6)}60%{transform:rotateY(-10deg) scale(1.05)}100%{transform:none}}
.m-actions{display:flex;gap:14px;align-items:center;justify-content:center}
.buy{display:flex;align-items:center;gap:8px;height:72px;padding:0 22px;border-radius:999px;background:var(--grass);color:#fff;font-family:var(--display);font-weight:700;font-size:1.8rem}
.buy span{display:block;width:40px;height:40px}
.buy svg{display:block;width:100%;height:100%}
.buy.no{background:#C9C6D9;color:var(--ink)}
.buy.shake{animation:shake .4s ease}
.need{width:100%;height:18px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden;box-sizing:border-box}
.need i{display:block;height:100%;background:var(--sun)}

/* ---------- WORD DATABASE ---------- */
#worddb{overflow-y:auto;gap:18px;padding-bottom:20px}
#worddb h2{margin:0;font-family:var(--display);font-size:1.8rem}
.db-cat{display:flex;flex-direction:column;gap:10px}
.db-head{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.3rem}
.db-head .ico{width:44px;height:44px;border-radius:12px;border:3px solid var(--ink);background:var(--c);padding:2px;box-sizing:border-box}
.db-head .ico svg{display:block;width:100%;height:100%}
.db-head small{font-family:var(--body);font-weight:700;font-size:.85rem;color:var(--muted)}
.db-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));gap:12px}
.db-word{display:flex;flex-direction:column;gap:4px;padding:8px;border-radius:18px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.db-word .pic{aspect-ratio:1;border-radius:12px;border:2.5px solid var(--ink);background:radial-gradient(circle at 50% 55%, rgba(255,255,255,.75) 0 44%, transparent 45%), color-mix(in srgb, var(--c) 55%, #fff)}
.db-word .pic svg{display:block;width:100%;height:100%}
.db-word b{font-family:var(--display);font-size:1.15rem;line-height:1.1}
.db-word .cz{font-weight:700;font-size:.9rem;color:var(--muted)}
.db-word .cz.edited{color:#B07A00}
.db-word .row{display:flex;align-items:center;gap:6px;margin-top:2px}
.db-word .row .pill{margin-left:auto}
.db-play{width:34px;height:34px;padding:4px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);box-sizing:border-box;display:grid;place-items:center}
.db-play svg{display:block;width:100%;height:100%}
.db-play.en{background:var(--sun)}
.pbtn-link{font-weight:800;font-size:.9rem;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

/* ---------- PARENTS ---------- */
#parents{overflow-y:auto;gap:18px;padding-bottom:20px;-webkit-user-select:text;user-select:text}
#parents h2{margin:0;font-family:var(--display);font-size:1.8rem}
#parents h3{margin:0 0 8px;font-family:var(--display);font-size:1.25rem}
.p-note{margin:0;color:var(--muted);font-weight:700;font-size:.92rem;max-width:70ch;line-height:1.45}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:14px 16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));gap:10px}
.tile{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:10px 12px}
.tile b{display:block;font-family:var(--display);font-size:1.8rem;font-variant-numeric:tabular-nums}
.tile span{font-weight:700;font-size:.85rem;color:var(--muted)}
.topic{display:grid;grid-template-columns:7.5em 1fr auto;gap:10px;align-items:center;padding:5px 0;font-weight:700;font-size:.92rem}
.bar3{display:flex;height:16px;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden;background:#E6E4EE}
.bar3 i{display:block;height:100%}
.k-known{background:var(--grass)} .k-learning{background:var(--sun)} .k-weak{background:var(--tomato)} .k-new{background:#E6E4EE}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-weight:700;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);margin-right:5px;vertical-align:-1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;border:2.5px solid var(--ink);background:var(--paper);font-weight:800;font-size:.9rem}
.chip svg{width:30px;height:30px}
.chip small{font-weight:700;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem;min-width:520px}
.tbl th{text-align:left;font-size:.8rem;color:var(--muted);padding:6px 8px;border-bottom:2.5px solid var(--ink)}
.tbl td{padding:6px 8px;border-bottom:1.5px solid #E6E4EE;font-weight:700;font-variant-numeric:tabular-nums}
.tbl td.n,.tbl th.n{text-align:right}
.czedit{display:flex;align-items:center;gap:4px}
.czin{
  font:inherit;font-weight:700;width:11em;max-width:46vw;padding:4px 8px;border-radius:8px;
  border:2px solid #C9C6D9;background:var(--paper);color:var(--ink);
  -webkit-user-select:text;user-select:text;
}
.czin:focus{outline:none;border-color:var(--berry)}
.czedit.edited .czin{border-color:var(--sun);background:#FFF6D6}
.cz-play,.cz-reset{width:30px;height:30px;flex:none;display:grid;place-items:center;padding:0;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-weight:800;font-size:1rem}
.cz-play svg{width:16px;height:16px}
.cz-reset{visibility:hidden}
.czedit.edited .cz-reset{visibility:visible}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;border:2px solid var(--ink);font-size:.78rem}
.reset-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pbtn{padding:10px 16px;border-radius:14px;font-weight:800;font-size:.95rem}
.pbtn.danger{background:var(--tomato);color:#fff}

/* ---------- DONE ---------- */
#done{align-items:center;justify-content:center;text-align:center;gap:18px}
.trophy{width:min(30vh, 52vw);aspect-ratio:1;animation:hop 1s ease infinite}
.done-title{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(2.2rem, 8vw, 3.4rem);color:var(--tomato)}
.done-stars{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;max-width:520px}
.done-stars svg{width:42px;height:42px}
.done-stars .dot{width:22px;height:22px;border-radius:50%;background:var(--grass);border:3px solid var(--ink);margin:0 6px}
.done-btns{display:flex;gap:16px}
.done-btns .ctl{width:88px;height:88px}

/* confetti */
.bit{position:fixed;left:0;top:0;width:28px;height:28px;pointer-events:none;z-index:50;animation:fly .9s ease-out forwards}
.bit.blob{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--ink)}
@keyframes fly{to{transform:translate(var(--dx), var(--dy)) rotate(var(--r)) scale(.6);opacity:0}}
.pop{animation:popk .3s ease}
@keyframes popk{50%{transform:scale(1.12) rotate(-3deg)}}


@media (max-width:520px){
  .cat{width:84px}
  .cat .ico{font-size:2rem}
  .ctl{width:54px;height:54px}
  .ctl svg{width:28px;height:28px}
  .ctl.say{width:74px;height:74px}
  .ctl.say svg{width:38px;height:38px}
  .controls{gap:8px}
  .ear{width:100px;height:100px}
}
@media (max-height:620px){
  .ear{width:84px;height:84px}
  .ear svg{width:44px;height:44px}
  .ctl.say{width:76px;height:76px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<script>
/* =====================================================================
   DATABÁZE SLOVÍČEK
   Každé téma: název (česky), en = jak se téma přečte anglicky, ikona (obrázek některého slovíčka), barva karty.
   Každé slovíčko: [ "anglicky", "česky" ] – obrázek se najde podle anglického slova v pics.js,
   nahrávka v audio/gb/<slovo>.mp3 (pomalá v audio/gb-slow/, česká v audio/cs/).
   ===================================================================== */
const CATEGORIES = [
  { id:'l1', name:'Lekce 1', en:'Lesson one', icon:'teddy bear', color:'#FFB443', words:[
    ['teddy bear','plyšový medvídek'], ['monkey','opice'], ['face','obličej'],

  { id:'l2', name:'Lekce 2', en:'Lesson two', icon:'banana', color:'#FFD966', words:[
    ['smile','úsměv'], ['friend','kamarád'], ['apple','jablko'], ['banana','banán'],
    ['potato','brambora'], ['boy','kluk'], ['car','auto'],
    ['big','velký'], ['small','malý'],
    ['give','dej'], ['stop','stůj'], ['choose','vyber'],
    ['stand up','vstaň'], ['sit down','sedni si'], ['turn around','otoč se'],
  ]},
  { id:'l3', name:'Lekce 3', en:'Lesson three', icon:'cow', color:'#8EDB8A', words:[
    ['pencil','tužka'], ['happy','veselý'], ['sad','smutný'], ['tired','unavený'],
    ['horse','kůň'], ['cow','kráva'], ['sheep','ovce'], ['pig','prase'],
    ['duck','kachna'], ['dog','pes'], ['cat','kočka'], ['hen','slepice'],
  ]},
  { id:'l4', name:'Lekce 4', en:'Lesson four', icon:'head', color:'#7FD4F0', words:[

// how often each word comes up: 1 = normal; mistakes raise it, correct answers bring it back down

}

function pickWeighted(list, k){
  const rest = list.slice(), out = [];
  while (out.length < k && rest.length){
    const tot = rest.reduce((a, w) => a + weightOf(w), 0);
    let r = Math.random() * tot, i = 0;
    for (; i < rest.length - 1; i++){ r -= weightOf(rest[i]); if (r <= 0) break; }
    out.push(rest.splice(i, 1)[0]);

}

function tts(text, slow, lang = 'en-GB'){   // backup only if a recording cannot play

    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = slow ? .5 : .85;
    speechSynthesis.speak(u);

}

function say(text, { slow = false, el = null, folder = null, ttsText = null, ttsLang = 'en-GB' } = {}){
  stopTalk();
  try { player.pause(); } catch(e){}
  player.muted = false;
  player.src = `audio/${folder || (slow ? 'gb-slow' : 'gb')}/${slug(text)}.mp3`;
  talkEl = el; el?.classList.add('talking');
  const pr = player.play();
  if (pr && pr.catch) pr.catch(err => { if (err && err.name === 'AbortError') return; stopTalk(); tts(ttsText || text, slow, ttsLang); });

// an edited translation has no recording, so the device's own Czech voice reads it
function ttsWait(text, lang, el){
  return new Promise(res => {
    let done = false;
    const fin = () => { if (done) return; done = true; if (talkEl === el) stopTalk(); res(); };
    try {
      if (!('speechSynthesis' in window)) return fin();
      stopTalk(); try { player.pause(); } catch(e){}
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = .9;
      const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(lang.slice(0, 2)));
      if (v) u.voice = v;
      talkEl = el; el?.classList.add('talking');
      u.onend = u.onerror = fin;
      setTimeout(() => speechSynthesis.speak(u), 60);
      setTimeout(fin, 5000);
    } catch(e){ fin(); }
  });
}
function czWait(w, el = null){
  if (czEdits[w.en]) return ttsWait(w.cz, 'cs-CZ', el);
  return sayWait(w.en, { folder: 'cs', el, ttsText: w.cz, ttsLang: 'cs-CZ' });

let actx = null;
function audio(){ try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(e){} return actx; }
function tone(freqs, dur = .12, type = 'sine', vol = .14){
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + .01;
  freqs.forEach((f, i) => {
    const o = a.createOscillator(), g = a.createGain(), s = t0 + i * dur;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, s);
    g.gain.exponentialRampToValueAtTime(vol, s + .02);
    g.gain.exponentialRampToValueAtTime(.0001, s + dur * 1.7);
    o.connect(g); g.connect(a.destination); o.start(s); o.stop(s + dur * 1.9);
  });
}

const ROUNDS = 10;
const quiz = { list: [], i: 0, results: [], missed: false, busy: false, token: 0, again: new Set() };
function startQuiz(){
  const p = pool();
  quiz.list = pickWeighted(p, Math.min(ROUNDS, p.length));
  quiz.i = 0; quiz.results = []; quiz.token++; quiz.again = new Set(); quiz.wrongClicks = 0;
  show('quiz'); renderRound();
}
function renderProgress(){
  const el = $('#qprog'); el.innerHTML = '';
  quiz.list.forEach((_, i) => {
    const d = document.createElement('i');
    const r = quiz.results[i];
    if (r === 'star'){ d.className = 'star'; d.innerHTML = STAR; }
    else if (r === 'ok'){ d.className = 'ok'; }
    else if (i === quiz.i){ d.className = 'now'; }
    el.appendChild(d);
  });
}
function renderRound(){
  const target = quiz.list[quiz.i];
  const p = pool();
  const n = state.n;
  const opts = [target];
  for (const w of shuffle(p).concat(shuffle(ALL))){
    if (opts.length >= n) break;
    if (!opts.some(o => same(o, w))) opts.push(w);
  }
  shuffle(opts).forEach((w, i) => opts[i] = w);
  quiz.missed = false; quiz.busy = false;
  renderProgress();
  const box = $('#choices'); box.innerHTML = ''; box.classList.remove('waiting');
  layoutChoices(n);
  for (const w of opts){
    const b = document.createElement('button');
    b.className = 'stk choice'; b.style.setProperty('--c', w.cat.color);
    b.setAttribute('aria-label', w.cz);
    b.innerHTML = `<span class="pic">${drawPic(w.en)}</span>`;
    b.onclick = () => pick(b, w, target);
    box.appendChild(b);
  }

  setTimeout(() => { if (t === quiz.token && screen === 'quiz') say(target.en, { el: $('#qsay') }); }, 450);
}
function layoutChoices(n){
  const box = $('#choices');
  const narrow = innerWidth < 560;
  const cols = narrow ? { 2: 2, 3: 3, 4: 2, 5: 3 }[n] : n;
  const rows = Math.ceil(n / cols);
  const avail = box.clientHeight || (innerHeight - 260);
  box.style.setProperty('--cols', cols);
  box.style.setProperty('--max', Math.max(90, Math.floor((avail - (rows - 1) * 14) / rows) - 8) + 'px');
}
addEventListener('resize', () => { if (screen === 'quiz') layoutChoices(state.n); });
async function pick(btn, w, target){
  if (quiz.busy) return;
  if (!same(w, target)){
    btn.classList.add('wrong'); btn.disabled = true; boop();
    wstat(target.en).wrong++; wstat(target.en).streak = 0; quiz.wrongClicks++; saveStats();
    if (!quiz.missed){
      quiz.missed = true;
      setWeight(target, weightOf(target) + 2);          // comes up more often from now on
      if (!quiz.again.has(target.en)){                  // and once more later in this game
        quiz.again.add(target.en);
        quiz.list.splice(Math.min(quiz.i + 3, quiz.list.length), 0, target);
        renderProgress();
      }
    }
    // no more guessing until the child has heard the word in Czech and again in English
    quiz.busy = true;
    const box = $('#choices'); box.classList.add('waiting');
    const t = quiz.token;
    await wait(350); if (t !== quiz.token) return;
    await czWait(target, $('#qsay')); if (t !== quiz.token) return;
    await wait(300); if (t !== quiz.token) return;
    await sayWait(target.en, { el: $('#qsay') }); if (t !== quiz.token) return;
    box.classList.remove('waiting'); quiz.busy = false;
    return;
  }
  quiz.busy = true;
  const t = quiz.token;
  btn.classList.add('right'); ding(); confetti(btn);
  quiz.results[quiz.i] = quiz.missed ? 'ok' : 'star';
  if (!quiz.missed){ addStar(); setWeight(target, weightOf(target) - 1); }
  { const st = wstat(target.en); st.last = Date.now(); if (quiz.missed) st.late++; else { st.first++; st.streak++; } saveStats(); }
  renderProgress();
  $('#choices').querySelectorAll('button').forEach(b => b.disabled = true);
  await wait(300); if (t !== quiz.token) return;
  say(target.en, { el: $('#qsay') });
  await wait(1500); if (t !== quiz.token) return;
  quiz.i++;
  if (quiz.i >= quiz.list.length) finishQuiz(); else renderRound();
}

  stats.games = stats.games.slice(0, 40); saveStats();
  $('#done-stars').innerHTML = STAR.repeat(got) + '<b class="dot"></b>'.repeat(quiz.results.length - got);
  fanfare(); say('Well done!');
  setTimeout(() => confetti($('.trophy'), 22), 150);

}

const GAMES = {
  /* pes skáče přes kameny a keříky */

    setup(){

    },
    tap(){ if (game.y <= 1){ game.vy = game.H * 1.55; tone([520, 780], .06, 'triangle', .07); } },
    update(dt, pace){
      const speed = (game.W * .3 + game.H * .3) * pace, S = game.size;
      game.dist += speed * dt;
      game.vy -= game.H * 3.4 * dt; game.y += game.vy * dt;
      if (game.y < 0){ game.y = 0; game.vy = 0; }
      const hx = game.W * .08;
      place(game.hero, hx, game.gy - S - game.y, game.y > 1 ? -8 : Math.sin(game.t * 18) * 3);
      if ((game.nextOb -= dt) <= 0){
        const s = S * (.42 + Math.random() * .14);
        game.items.push({ kind: 'ob', s, x: game.W + 10, y: game.gy - s * .94, el: sprite(drawPic(Math.random() < .5 ? '_rock' : '_bush'), s) });
        game.nextOb = (1.7 + Math.random() * 1.2) / pace;
      }
      if ((game.nextSt -= dt) <= 0){

        game.items.push({ kind: 'star', s, x: game.W + 10, y: game.gy - s - S * (.25 + Math.random() * .9), el: sprite(STAR, s, 'star') });
        game.nextSt = (1.1 + Math.random() * .9) / pace;
      }
      const top = game.gy - S - game.y;
      const r = { x1: hx + S * .28, x2: hx + S * .72, y1: top + S * .25, y2: top + S };
      for (const it of game.items){
        it.x -= speed * dt; place(it.el, it.x, it.y);
        if (it.x < -it.s - 20) it.dead = true;
        if (it.hit || it.dead) continue;
        if (it.x + it.s * .2 < r.x2 && it.x + it.s * .8 > r.x1 && it.y + it.s * .3 < r.y2 && it.y + it.s > r.y1){
          if (it.kind === 'star') catchStar(it); else { it.hit = true; bump(game.hero); }
        }
      }
      $('#ground').style.backgroundPositionX = -(game.dist % 40) + 'px';
    },
  },

  /* auto na silnici: klepnutí vlevo / vpravo přejede do vedlejšího pruhu */
  car: {
    setup(){
      const w = $('#world');
      const roadW = Math.min(game.W * .86, game.H * .78);
      game.roadX = (game.W - roadW) / 2; game.laneW = roadW / 3;
      w.innerHTML = `<div class="road" style="left:${game.roadX}px;width:${roadW}px">

        <div class="lane" style="left:33.33%"></div><div class="lane" style="left:66.66%"></div></div>`;
      game.size = game.laneW * .82;
      game.lane = 1; game.cx = this.laneX(1); game.dist = 0; game.nextOb = 1.6; game.nextSt = .8; game.nextDeco = 0;
      game.hero = sprite(drawPic('_carTop'), game.size, 'car');
    },
    laneX(l){ return game.roadX + game.laneW * (l + .5) - game.size / 2; },
    tap(x){ const d = x < .5 ? -1 : 1; const n = Math.max(0, Math.min(2, game.lane + d)); if (n !== game.lane){ game.lane = n; tone([600 + n * 80], .06, 'triangle', .07); } },
    update(dt, pace){
      const speed = game.H * .6 * pace, S = game.size;
      game.dist += speed * dt;
      game.cx += (this.laneX(game.lane) - game.cx) * Math.min(1, dt * 12);
      const hy = game.H - S - game.H * .05;
      place(game.hero, game.cx, hy, (this.laneX(game.lane) - game.cx) * .08);
      const lane = () => Math.floor(Math.random() * 3);
      if ((game.nextOb -= dt) <= 0){
        const other = Math.random() < .45;
        game.items.push({ kind: 'ob', s: S * (other ? 1 : .62), lane: lane(), y: -S, slow: other ? .45 : 0, el: sprite(drawPic(other ? '_carTop2' : '_cone'), S * (other ? 1 : .62)) });
        game.nextOb = (1.3 + Math.random() * .9) / pace;
      }
      if ((game.nextSt -= dt) <= 0){
        game.items.push({ kind: 'star', s: S * .5, lane: lane(), y: -S, slow: 0, el: sprite(STAR, S * .5, 'star') });
        game.nextSt = (.9 + Math.random() * .7) / pace;
      }
      if ((game.nextDeco -= dt) <= 0){
        const left = Math.random() < .5, s = Math.min(game.roadX * .8, S * .7);
        if (s > 24) game.items.push({ kind: 'deco', s, x: left ? (game.roadX - s) / 2 : game.roadX + game.laneW * 3 + (game.roadX - s) / 2, y: -s, slow: 0, el: sprite(drawPic('_bush'), s) });
        game.nextDeco = .7 + Math.random() * .6;
      }
      for (const it of game.items){
        it.y += speed * (1 - it.slow) * dt;
        const x = it.x != null ? it.x : game.roadX + game.laneW * (it.lane + .5) - it.s / 2;
        place(it.el, x, it.y);
        if (it.y > game.H + 10) it.dead = true;
        if (it.hit || it.dead || it.kind === 'deco') continue;
        if (Math.abs(x + it.s / 2 - (game.cx + S / 2)) < game.laneW * .55 && it.y + it.s * .9 > hy + S * .1 && it.y + it.s * .1 < hy + S * .9){
          if (it.kind === 'star') catchStar(it); else { it.hit = true; bump(game.hero); }
        }
      }
      $('#world').querySelectorAll('.road .lane, .road .edge').forEach(l => l.style.backgroundPositionY = (game.dist % (l.classList.contains('lane') ? 68 : 40)) + 'px');
    },
  },

  /* motorka v kopcích: klepnutí = skok, klepnutí ve vzduchu = salto (bonusová hvězda) */
  moto: {
    setup(){
      const w = $('#world');
      w.innerHTML = `<div class="sunb"></div><div class="cloud c1"></div><div class="cloud c2"></div>
        <div class="mount" style="left:-6%"></div><div class="mount" style="left:46%;width:60%"></div>
        <svg class="hills" viewBox="0 0 ${game.W} ${game.H}" preserveAspectRatio="none"><path id="hill" fill="#7FD48A" stroke="${'#2E2A47'}" stroke-width="5" stroke-linejoin="round"/><path id="hill-road" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="16 18" opacity=".8"/></svg>`;
      game.size = Math.max(60, Math.min(game.H * .26, game.W * .24));
      game.dist = 0; game.by = 0; game.vy = 0; game.air = false; game.rot = 0; game.flip = 0; game.flipped = false; game.nextSt = .6;
      game.hero = sprite(drawPic('_moto'), game.size, 'moto');
      game.hero.style.transformOrigin = '50% 75%';
      game.by = this.ground(game.W * .22);
    },
    ground(sx){ const X = game.dist + sx, W = game.W, H = game.H; return H * .7 + H * .09 * Math.sin(X / W * 2.4) + H * .05 * Math.sin(X / W * 6.1 + 1); },
    tap(){
      if (!game.air){ game.air = true; game.vy = -game.H * 1.45; tone([440, 660], .06, 'triangle', .07); }
      else if (!game.flip){ game.flip = 1; game.flipped = false; tone([700, 900, 1100], .05, 'triangle', .06); }
    },
    update(dt, pace){
      const speed = (game.W * .3 + game.H * .2) * pace, S = game.size, bx = game.W * .22;
      game.dist += speed * dt;
      // hills
      let d = '', dr = '';
      for (let i = 0; i <= 40; i++){ const x = game.W * i / 40, y = this.ground(x); d += (i ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1); dr += (i ? 'L' : 'M') + x.toFixed(1) + ',' + (y + game.H * .05).toFixed(1); }
      $('#hill').setAttribute('d', d + `L${game.W + 10},${game.H + 10}L-10,${game.H + 10}Z`);
      $('#hill-road').setAttribute('d', dr);
      const gy = this.ground(bx);
      const slope = Math.atan2(this.ground(bx + 12) - this.ground(bx - 12), 24) * 180 / Math.PI;
      if (game.air){
        game.vy += game.H * 3.2 * dt; game.by += game.vy * dt;
        if (game.flip){ game.flip += dt; game.rot = -360 * Math.min(1, (game.flip - 1) / .55); if (game.flip - 1 >= .55){ game.flip = 0; game.rot = 0; game.flipped = true; } }
        else game.rot = Math.max(-25, Math.min(25, game.vy / game.H * 12));
        if (game.by >= gy && game.vy > 0){
          game.by = gy; game.air = false; game.vy = 0; game.rot = slope;
          if (game.flip){ game.flip = 0; }                     // landed mid-flip: no bonus
          if (game.flipped){ game.flipped = false; const it = { el: sprite(STAR, S * .5, 'star'), s: S * .5 }; game.items.push(it); catchStar(it); confetti(game.hero, 8); }
        }
      } else { game.by = gy; game.rot = slope; }
      place(game.hero, bx - S / 2, game.by - S * .92, game.rot);
      if ((game.nextSt -= dt) <= 0){
        const s = S * .45, ahead = game.W + 10;
        game.items.push({ kind: 'star', s, x: ahead, y: this.ground(ahead + s / 2) - s - S * (.4 + Math.random() * 1.3), el: sprite(STAR, s, 'star') });
        game.nextSt = (.7 + Math.random() * .7) / pace;
      }
      const r = { x1: bx - S * .4, x2: bx + S * .4, y1: game.by - S * .9, y2: game.by };
      for (const it of game.items){
        if (it.dead) continue;
        it.x -= speed * dt; place(it.el, it.x, it.y);
        if (it.x < -it.s - 20) it.dead = true;
        else if (it.x + it.s * .2 < r.x2 && it.x + it.s * .8 > r.x1 && it.y + it.s * .2 < r.y2 && it.y + it.s * .8 > r.y1) catchStar(it);
      }
    },
  },
};

function startGame(kind){
  if (!kind){ const opts = Object.keys(GAMES).filter(k => k !== game.kind); kind = opts[Math.floor(Math.random() * opts.length)]; }
  show('game');
  const world = $('#world');
  world.className = 'world w-' + kind;
  const r = world.getBoundingClientRect();
  Object.assign(game, { on: true, kind, t: 0, dur: GAME_LEN, score: 0, hurt: 0, items: [], W: r.width, H: r.height, last: performance.now(), token: game.token + 1 });
  $('#gscore').textContent = '0';
  game.g = GAMES[kind];
  game.g.setup();
  game.hint = sprite(drawPic('tap'), 110, 'hint');
  game.hint.classList.add('ghint'); game.hint.style.left = '50%'; game.hint.style.top = '40%';
  requestAnimationFrame(loop);
}
function loop(now){
  if (!game.on) return;
  const dt = Math.min(.05, (now - game.last) / 1000); game.last = now;
  game.t += dt;
  if (game.hurt > 0) game.hurt -= dt;
  game.g.update(dt, 1 + game.t / 80);
  cleanItems();
  $('#gtime').style.width = Math.max(0, 100 - game.t / game.dur * 100) + '%';
  if (game.t >= game.dur) return endGame();
  requestAnimationFrame(loop);
}
function tapGame(x){
  if (!game.on) return;
  if (game.hint){ game.hint.remove(); game.hint = null; }
  game.g.tap(x);
}
$('#world').addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = $('#world').getBoundingClientRect();
  tapGame((e.clientX - r.left) / r.width);
});
addEventListener('keydown', e => {
  if (screen !== 'game') return;
  if (e.key === 'ArrowLeft'){ e.preventDefault(); tapGame(.2); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); tapGame(.8); }
  else if (e.key === ' ' || e.key === 'ArrowUp'){ e.preventDefault(); tapGame(.5); }
});
addEventListener('resize', () => {
  if (!game.on) return;
  const r = $('#world').getBoundingClientRect();
  if (Math.abs(r.width - game.W) < game.W * .15 && Math.abs(r.height - game.H) < game.H * .15) return;
  // simplest robust answer to a rotated phone: restart the same mini-game at the new size, keep the time
  const t = game.t, sc = game.score, kind = game.kind;
  startGame(kind); game.t = t; game.score = sc; $('#gscore').textContent = sc;
});
function endGame(){
  game.on = false;
  fanfare(); say('Great job!');
  confetti(game.hero, 20);
  const t = game.token;
  setTimeout(() => {
    if (t !== game.token || screen !== 'game') return;
    $('#world').innerHTML = '';
    show('done'); $('#done-btns').hidden = false;
  }, 1600);
}

(() => {

    $('#reset-row').innerHTML = `<b>${question}</b><button class="stk pbtn danger" id="reset-yes">${yesLabel}</button><button class="stk pbtn" id="reset-no">Ne, nechat</button>`;
    $('#reset-no').onclick = () => { openParents(); $('#reset-panel').scrollIntoView(); };
    $('#reset-yes').onclick = () => { action(); openParents(); $('#reset-panel').scrollIntoView(); flashNote(); };
  };
  const clearStats = () => {
    stats.w = {}; stats.games = []; stats.earned = 0; saveStats();
    Object.keys(W).forEach(k => delete W[k]); store.set('weights', W);
  };
  const flashNote = () => $('#reset-row').insertAdjacentHTML('afterbegin', '<b style="color:var(--grass)">Hotovo, postup je vymazaný.</b>');
  $('#reset-1').onclick = () => confirmReset('Opravdu vymazat statistiku? Nejde to vrátit.', 'Ano, vymazat statistiku', clearStats);
  $('#reset-all').onclick = () => confirmReset(`Opravdu začít od začátku? Zmizí statistika, hvězdičky (${state.stars}) a karty ze sbírky (${owned.size}). Nejde to vrátit.`, 'Ano, začít od začátku', () => {
    clearStats();
    state.stars = 0; store.set('stars', 0); $('#stars').textContent = '0';
    owned.clear(); store.set('owned', []);
  });
}

$('#qsay').onclick = () => say(quiz.list[quiz.i].en, { el: $('#qsay') });
$('#again').onclick = startQuiz;
$('#done-home').onclick = goHome;

/* ---------- wiring ---------- */
$('#go-cards').onclick = startCards;
$('#go-quiz').onclick = startQuiz;
$('#go-shop').onclick = openShop;
$('#home-btn').onclick = goHome;
addEventListener('keydown', e => {
  if (screen !== 'cards') return;
  if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
});

$('#stars').textContent = state.stars;
$('#bar-star').innerHTML = STAR;
$('#slow').innerHTML = drawPic('_turtle');
$('#go-cards .ico').innerHTML = drawPic('_cards');
$('#go-quiz .ico').innerHTML = drawPic('ears');
$('.trophy').innerHTML = drawPic('big');
$('#ukbadge').innerHTML = drawPic('_uk');
$('#czbtn').innerHTML = drawPic('_cz');
$('#gstar').innerHTML = STAR;
$('#go-shop .ico').innerHTML = drawPic('card:dragon');
renderCats();
renderDiff();
show('home');
